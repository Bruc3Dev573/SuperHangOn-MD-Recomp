# Builds the Linux, Windows, macOS and browser WASM packages (no game code,
# no ROM data) and, for a tag v*, publishes them as a release. Run by hand,
# it only keeps the packages as workflow artifacts.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  packages:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libsdl2-dev gcc-mingw-w64-x86-64 zip curl

      - name: Linux package
        run: tools/package_linux.sh

      - name: Windows package
        run: tools/package_windows.sh

      - uses: actions/upload-artifact@v4
        with:
          name: packages-linux-windows
          path: |
            build/dist/*.tar.gz
            build/dist/*.zip

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check architecture
        run: test "$(uname -m)" = "arm64"

      - name: Dependencies
        run: brew install cmake pkg-config sdl2 sdl3

      - name: macOS package
        run: tools/package_macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: packages-macos
          path: build/dist/*.zip

  wasm:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Browser package
        run: tools/package_wasm.sh

      - uses: actions/upload-artifact@v4
        with:
          name: packages-wasm
          path: build/dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [packages, macos, wasm]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: build/dist

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/dist/*.tar.gz build/dist/*.zip \
            --title "Super Hang-On $GITHUB_REF_NAME" \
            --notes "Linux, Windows, macOS Apple Silicon and browser WASM builds. Packages contain no game code and no ROM data: native builds read baserom.md next to the executable; the browser asks for the same ROM in the page and keeps it in local storage. At the first start the game code is translated from it."
